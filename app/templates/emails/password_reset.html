<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f3f4f6; color: #111827; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background: #f3f4f6; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 560px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px;">
            <tr>
              <td style="padding: 32px 32px 20px;">
                <h1 style="margin: 0; color: #111827; font-size: 22px; line-height: 1.3; font-weight: 700;">
                  Reset your NexoScribe password
                </h1>
                <p style="margin: 16px 0 0; color: #374151; font-size: 15px; line-height: 1.6;">
                  We received a request to reset your password. Use the button below to choose a new one.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 4px 32px 28px;">
                <a href="{{ reset_url }}" style="display: inline-block; background: #111827; color: #ffffff; padding: 12px 18px; border-radius: 6px; font-size: 15px; font-weight: 700; text-decoration: none;">
                  Reset password
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 28px;">
                <p style="margin: 0 0 10px; color: #6b7280; font-size: 13px; line-height: 1.6;">
                  If the button does not work, copy and paste this link into your browser:
                </p>
                <p style="margin: 0; color: #374151; font-size: 13px; line-height: 1.6; word-break: break-all;">
                  {{ reset_url }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 32px 32px; border-top: 1px solid #e5e7eb;">
                <p style="margin: 0; color: #6b7280; font-size: 12px; line-height: 1.6;">
                  If you did not request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
